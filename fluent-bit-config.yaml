apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Log_Level    info
        Parsers_File parsers.conf

    [INPUT]
        Name         tail
        Path         /app/logs/backend.log
        Tag          backend_logs
        Refresh_Interval 5
        DB           /fluent-bit/logs.db
        Mem_Buf_Limit 5MB

    [OUTPUT]
        Name   stdout
        Match  *
